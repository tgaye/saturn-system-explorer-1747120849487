<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saturn System Explorer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        #canvas-container {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            position: relative;
        }
        .label {
            position: absolute;
            color: white;
            pointer-events: none;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            text-align: center;
            pointer-events: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<base target="_self">


    <div id="canvas-container"></div>
    <div id="instructions">Drag to rotate • Scroll to zoom • Click to toggle labels</div>
    <script>
        const sketch = (p) => {
            let scene, camera, renderer;
            let saturn, rings;
            let moons = [];
            let stars = [];
 let sunLight;
            let labelsVisible = false;
            let isgging = false;
            let previousMouseX = 0;
            let previousMouseY = 0;
            let rotationX = 0;
            let rotationY = 0;
            let targetRotationX = 0;
            let targetRotationY = 0;
            let zoom = 10;
            let targetZoom = 10;
            let starGeometry, starMaterial, starPoints;
            let moonData = [
                { name: "Titan", size: 0.4, distance: 8, speed: 0.002, color: 0xD4A76A },
                { name: "Enceladus", size: 0.2, distance: 5, speed: 0.005, color: 0xFFFFFF },
                { name: "Rhea", size: 0.3, distance: 6, speed: 0.003, color: 0xCCCCCC },
                { name: "Mimas", size: 0.15, distance: 4, speed: 0.006, color: 0xAAAAAA }
            ];
            let time = 0;
            let labelElements = [];

            p.setup = () => {
                const container = document.getElementById('canvas-container');
                const width = container.clientWidth;
                const height = container.clientHeight;

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(window.devicePixelRatio);
                container.appendChild(renderer.domElement);

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
                camera.position.z = 20;

                // Create Saturn
                const saturnGeometry = new THREE.SphereGeometry(2, 64, 64);
                const saturnMaterial = new THREE.MeshPhongMaterial({
                    color: 0xE3D4B0,
                    specular: 0x111111,
                    shininess: 5,
                    map: createSaturnTexture()
                });
                saturn = new THREE.Mesh(saturnGeometry, saturnMaterial);
                scene.add(saturn);

                // Create rings
                const ringGeometry = new THREE.RingGeometry(2.5, 5, 64);
                const ringMaterial = new THREE.MeshPhongMaterial({
                    color: 0xE8E1C6,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.8,
                    map: createRingTexture()
                });
                rings = new THREE.Mesh(ringGeometry, ringMaterial);
                rings.rotation.x = Math.PI / 2;
                scene.add(rings);

                // Create moons
                moonData.forEach((moon, i) => {
                    const geometry = new THREE.SphereGeometry(moon.size, 32, 32);
                    const material = new THREE.MeshPhongMaterial({ color: moon.color });
                    const mesh = new THREE.Mesh(geometry, material);
                    
                    // Position moons in a circle around Saturn
                    const angle = Math.random() * Math.PI * 2;
                    mesh.position.x = Math.cos(angle) * moon.distance;
                    mesh.position.z = Math.sin(angle) * moon.distance;
                    
                    scene.add(mesh);
                    moons.push({ mesh, data: moon, angle });

                    // Create label element
                    const label = document.createElement('div');
                    label.className = 'label';
                    label.textContent = moon.name;
                    label.id = `moon-label-${i}`;
                    document.getElementById('canvas-container').appendChild(label);
                    labelElements.push(label);
                });

                // Create stars
                createStars();

                // Lighting
                sunLight = new THREE.DirectionalLight(0xFFFFFF, 1);
                sunLight.position.set(10, 10, 10);
                scene.add(sunLight);

                const ambientLight = new THREE.AmbientLight(0x333333);
                scene.add(ambientLight);

                // Event listeners
                renderer.domElement.addEventListener('mousedown', onMouseDown);
                renderer.domElement.addEventListener('mousemove', onMouseMove);
                renderer.domElement.addEventListener('mouseup', onMouseUp);
                renderer.domElement.addEventListener('wheel', onMouseWheel);
                renderer.domElement.addEventListener('click', toggleLabels);

                p.windowResized = () => {
                    const container = document.getElementById('canvas-container');
                    const width = container.clientWidth;
                    const height = container.clientHeight;
                    camera.aspect = width / height;
                    camera.updateProjectionMatrix();
                    renderer.setSize(width, height);
                };

                p.windowResized();
            };

            function createSaturnTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                // Create bands
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
                gradient.addColorStop(0, '#E3D4B0');
                gradient.addColorStop(0.2, '#D9C7A0');
                gradient.addColorStop(0.4, '#E3D4B0');
                gradient.addColorStop(0.6, '#E8D9B8');
                gradient.addColorStop(0.8, '#D9C7A0');
                gradient.addColorStop(1, '#E3D4B0');

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Add some atmospheric details
                ctx.strokeStyle = 'rgba(200, 180, 150, 0.3)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 20; i++) {
                    const y = Math.random() * canvas.height;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.bezierCurveTo(
                        canvas.width * 0.3, y + Math.random() * 20 - 10,
                        canvas.width * 0.7, y + Math.random() * 20 - 10,
                        canvas.width, y
                    );
                    ctx.stroke();
                }

                const texture = new THREE.CanvasTexture(canvas);
                return texture;
            }

            function createRingTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');

                // Create ring gradient
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
                gradient.addColorStop(0, 'rgba(232, 225, 198, 0)');
                gradient.addColorStop(0.2, 'rgba(232, 225, 198, 0.8)');
                gradient.addColorStop(0.5, 'rgba(255, 255, 255, 1)');
                gradient.addColorStop(0.8, 'rgba(232, 225, 198, 0.8)');
                gradient.addColorStop(1, 'rgba(232, 225, 198, 0)');

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Add some ring details
                for (let i = 0; i < 100; i++) {
                    const x = Math.random() * canvas.width;
                    const w = Math.random() * 10 + 5;
                    const opacity = Math.random() * 0.5 + 0.3;
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fillRect(x, 0, w, canvas.height);
                }

                const texture = new THREE.CanvasTexture(canvas);
                return texture;
            }

            function createStars() {
                const starCount = 1000;
                const positions = new Float32Array(starCount * 3);
                const colors = new Float32Array(starCount * 3);
                const sizes = new Float32Array(starCount);

                for (let i = 0; i < starCount; i++) {
                    // Position stars in a sphere around the scene
                    const radius = 50 + Math.random() * 450;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);

                    positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                    positions[i * 3 + 2] = radius * Math.cos(phi);

                    // Random color (mostly white with some blue/red stars)
                    const color = Math.random() > 0.9 ? 
                        (Math.random() > 0.5 ? [0.8, 0.8, 1.0] : [1.0, 0.8, 0.8]) : 
                        [1.0, 1.0, 1.0];
                    
                    colors[i * 3] = color[0];
                    colors[i * 3 + 1] = color[1];
                    colors[i * 3 + 2] = color[2];

                    sizes[i] = Math.random() * 2 + 0.5;
                }

                starGeometry = new THREE.BufferGeometry();
                starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                starGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

                starMaterial = new THREE.PointsMaterial({
                    size: 1,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.8,
                    sizeAttenuation: true
                });

                starPoints = new THREE.Points(starGeometry, starMaterial);
                scene.add(starPoints);
            }

            function onMouseDown(event) {
                isDragging = true;
                previousMouseX = event.clientX;
                previousMouseY = event.clientY;
            }

            function onMouseMove(event) {
                if (isDragging) {
                    const deltaX = event.clientX - previousMouseX;
                    const deltaY = event.clientY - previousMouseY;
                    
                    targetRotationY += deltaX * 0.01;
                    targetRotationX += deltaY * 0.01;
                    
                    previousMouseX = event.clientX;
                    previousMouseY = event.clientY;
                }
            }

            function onMouseUp() {
                isDragging = false;
            }

            function onMouseWheel(event) {
                event.preventDefault();
                targetZoom += event.deltaY * 0.01;
                targetZoom = Math.max(5, Math.min(targetZoom, 30));
            }

            function toggleLabels() {
                labelsVisible = !labelsVisible;
                labelElements.forEach(label => {
                    label.style.opacity = labelsVisible ? '1' : '0';
                });
            }

            function updateLabels() {
                if (!labelsVisible) return;

                moons.forEach((moon, i) => {
                    const label = labelElements[i];
                    const position = moon.mesh.position.clone();
                    position.project(camera);

                    const x = (position.x * 0.5 + 0.5) * renderer.domElement.clientWidth;
                    const y = (-(position.y * 0.5) + 0.5) * renderer.domElement.clientHeight;

                    label.style.left = `${x}px`;
                    label.style.top = `${y}px`;
                });
            }

            p.draw = () => {
                time += 0.01;

                // Smooth camera rotation
                rotationX += (targetRotationX - rotationX) * 0.1;
                rotationY += (targetRotationY - rotationY) * 0.1;
                
                // Smooth zoom
                zoom += (targetZoom - zoom) * 0.1;
                
                // Update camera position
                camera.position.x = Math.sin(rotationY) * Math.cos(rotationX) * zoom;
                camera.position.y = Math.sin(rotationX) * zoom;
                camera.position.z = Math.cos(rotationY) * Math.cos(rotationX) * zoom;
                camera.lookAt(0, 0, 0);

                // Animate Saturn's atmosphere
                saturn.rotation.y += 0.002;

                // Animate rings
                rings.rotation.z += 0.0005;

                // Animate moons
                moons.forEach((moon, i) => {
                    moon.angle += moon.data.speed;
                    moon.mesh.position.x = Math.cos(moon.angle) * moon.data.distance;
                    moon.mesh.position.z = Math.sin(moon.angle) * moon.data.distance;
                    moon.mesh.rotation.y += 0.01;
                });

                // Twinkle stars
                const starPositions = starGeometry.attributes.position.array;
                for (let i = 0; i < starPositions.length; i += 3) {
                    if (Math.random() < 0.01) {
                        const twinkle = Math.random() * 0.5 + 0.5;
                        starGeometry.attributes.size.array[i / 3] = twinkle * 2;
                    }
                }
                starGeometry.attributes.size.needsUpdate = true;

                // Update labels
                updateLabels();

                renderer.render(scene, camera);
            };
        };

        new p5(sketch);
    </script>
